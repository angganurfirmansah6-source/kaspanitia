<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasPanitia Premium</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.1.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
      :root {
        --bg: #edf5f3;
        --bg-2: #f8faf9;
        --panel: rgba(255,255,255,0.82);
        --panel-solid: #ffffff;
        --panel-soft: #f4faf8;
        --primary: #1e5b4d;
        --primary-2: #123d34;
        --primary-soft: #eaf5f1;
        --primary-soft-2: #eefaf6;
        --accent: #f1d16a;
        --accent-2: #f4c95b;
        --text: #17322d;
        --muted: #617b74;
        --line: #dfeae7;
        --success: #1d8e5d;
        --danger: #d85555;
        --warning: #c9861b;
        --info: #3d7ad9;
        --shadow: 0 18px 40px rgba(18,44,36,0.08);
        --shadow-soft: 0 12px 26px rgba(18,44,36,0.05);
        --radius-xl: 28px;
        --radius-lg: 18px;
        --radius-md: 14px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(30,91,77,0.10), transparent 28%),
          radial-gradient(circle at bottom right, rgba(241,209,106,0.15), transparent 25%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
        line-height: 1.5;
      }

      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      .hidden { display: none !important; }

      .auth-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .auth-card {
        width: min(100%, 440px);
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(24,49,45,0.08);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        padding: 30px 24px;
      }

      .auth-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .auth-badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--primary), var(--primary-2));
        color: white;
        font-size: 1.8rem;
        font-weight: 800;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .auth-brand strong {
        display: block;
        font-size: 1.2rem;
      }

      .auth-brand small {
        display: block;
        color: var(--muted);
      }

      .auth-title {
        margin: 0 0 8px;
        text-align: center;
        font-size: 2rem;
      }

      .auth-subtitle {
        margin: 0 0 20px;
        text-align: center;
        color: var(--muted);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .label {
        display: block;
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 700;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.86);
        padding: 11px 12px;
        color: var(--text);
        outline: none;
        transition: 0.2s ease;
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(30,91,77,0.5);
        box-shadow: 0 0 0 3px rgba(30,91,77,0.08);
      }

      textarea { min-height: 92px; resize: vertical; }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .btn:hover { transform: translateY(-1px); }
      .btn.primary {
        width: 100%;
        background: linear-gradient(180deg, var(--primary), var(--primary-2));
        color: white;
        box-shadow: 0 10px 22px rgba(30,91,77,0.18);
      }

      .btn.secondary {
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid var(--line);
      }

      .btn.warning {
        background: #fff8e6;
        color: var(--warning);
        border: 1px solid #f0dfad;
      }

      .btn.danger {
        background: #fff0f0;
        color: var(--danger);
        border: 1px solid #efcaca;
      }

      .login-error {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fff0f0;
        border: 1px solid #efcaca;
        color: var(--danger);
        font-size: 0.85rem;
      }

      .login-error.show { display: block; }

      .app-shell {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: linear-gradient(180deg, var(--primary-2), var(--primary));
        color: white;
        padding: 22px 16px 18px;
        box-shadow: inset -1px 0 0 rgba(255,255,255,0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        margin-bottom: 14px;
      }

      .brand-badge {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.06);
        color: white;
        font-size: 1.2rem;
        font-weight: 800;
      }

      .brand-title { font-weight: 700; font-size: 1.08rem; }
      .brand-sub { font-size: 0.74rem; color: rgba(255,255,255,0.72); }

      .user-box {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        padding: 12px 12px 10px;
        margin: 12px 0 16px;
      }

      .user-box-card {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 8px 8px;
        margin-bottom: 12px;
      }

      .user-mini-photo {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        display: block;
        border: 2px solid rgba(255,255,255,0.2);
      }

      .user-mini-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .user-mini-meta strong {
        font-size: 0.81rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .user-mini-meta small {
        color: rgba(255,255,255,0.72);
        font-size: 0.68rem;
      }

      .label-mini {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
        display: inline-block;
        margin-bottom: 8px;
      }

      .user-select {
        width: 100%;
        border: none;
        background: transparent;
        color: #fff;
        outline: none;
        font-size: 0.95rem;
      }

      .user-select option { color: #111; }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .nav-btn {
        width: 100%;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.9);
        border-radius: 12px;
        padding: 11px 12px;
        text-align: left;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .nav-btn:hover { background: rgba(255,255,255,0.06); }
      .nav-btn.active {
        background: rgba(255,255,255,0.13);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .main {
        padding: 26px 26px 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 220px;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow-soft);
      }

      .search-box input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
      }

      .right-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 700;
        color: var(--muted);
        box-shadow: var(--shadow-soft);
      }

      .chip.primary {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .user-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        box-shadow: var(--shadow-soft);
      }

      .avatar-wrapper {
        position: relative;
        display: inline-block;
      }

      .avatar-img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 2px solid rgba(30,91,77,0.12);
      }

      .profile-photo-wrap {
        position: relative;
        display: inline-block;
      }

      .photo-edit-btn,
      .avatar-edit-btn {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        color: var(--primary);
        font-size: 10px;
        font-weight: 700;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      }

      .hidden-file-input {
        display: none;
      }

      .user-pill strong { display: block; font-size: 0.88rem; }
      .user-pill small { color: var(--muted); font-size: 0.72rem; }

      .header-block {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .page-title { margin: 0; font-size: clamp(1.7rem, 3vw, 2.3rem); }
      .page-subtitle { margin: 6px 0 0; color: var(--muted); }

      .status-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .status-chip {
        background: rgba(255,255,255,0.86);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
        font-weight: 700;
      }

      .status-chip.active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: rgba(30,91,77,0.14);
      }

      .section {
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(24,49,45,0.06);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        padding: 18px;
        margin-bottom: 18px;
        backdrop-filter: blur(8px);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .section-header h3 { margin: 0; font-size: 1.08rem; }
      .muted { color: var(--muted); }

      .summary-box {
        background: linear-gradient(180deg, #eefaf5, #edf5f3);
        border-left: 4px solid var(--primary);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 18px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat-card {
        background: linear-gradient(180deg, #ffffff, #f3faf7);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        min-height: 120px;
        box-shadow: var(--shadow-soft);
      }

      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stat-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.05rem;
      }

      .icon-green { background: #eafaf0; color: var(--success); }
      .icon-red { background: #fdecec; color: var(--danger); }
      .icon-blue { background: #edf4ff; color: var(--info); }
      .icon-gold { background: #fff3df; color: var(--warning); }

      .stat-value {
        font-size: clamp(1.4rem, 2vw, 1.9rem);
        font-weight: 800;
      }

      .trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .trend.up { background: #eafaf0; color: var(--success); }
      .trend.down { background: #fdecec; color: var(--danger); }

      .main-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
        margin-bottom: 18px;
      }

      .chart-wrap {
        height: 220px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 4px 0;
      }

      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 8px;
        flex: 1;
        height: 100%;
      }

      .bar {
        width: 100%;
        max-width: 42px;
        border-radius: 12px 12px 0 0;
        background: linear-gradient(180deg, #bfe5c9, var(--primary));
        min-height: 32px;
      }

      .bar.alt { background: linear-gradient(180deg, #d8f4e3, #7fbc9d); }
      .bar-label { color: var(--muted); font-size: 0.72rem; }

      .mini-list { display: flex; flex-direction: column; gap: 12px; }
      .mini-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 8px;
        border-radius: 12px;
        background: linear-gradient(180deg, #f9fbfa, #f4faf8);
      }

      .mini-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .mini-item strong { display: block; }
      .mini-item small { color: var(--muted); }
      .mini-item .value { margin-left: auto; font-weight: 700; }

      .table-wrap { overflow-x: auto; }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        background: #fafcfb;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      tbody tr:hover { background: #f9fbfa; }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .badge.income { background: #eafaf0; color: var(--success); }
      .badge.expense { background: #fdecec; color: var(--danger); }
      .badge.transfer { background: #edf4ff; color: var(--info); }
      .badge.status-diajukan { background: #fff4df; color: var(--warning); }
      .badge.status-disetujui { background: #eafaf0; color: var(--success); }
      .badge.status-perlu-revisi { background: #fff1f1; color: var(--danger); }
      .badge.status-ditolak { background: #ffecef; color: var(--danger); }
      .badge.status-dicairkan { background: #e7faf4; color: var(--primary); }

      .money { font-weight: 700; }
      .money.in { color: var(--success); }
      .money.out { color: var(--danger); }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field { display: flex; flex-direction: column; gap: 8px; }
      .field.full { grid-column: 1 / -1; }

      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: #fbfdfc;
      }

      .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

      .list-card {
        background: linear-gradient(180deg, #f9fcfb, #f3faf7);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow-soft);
      }

      .mini-label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .big-number {
        font-size: 1.8rem;
        font-weight: 800;
      }

      .attachment-thumb {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #f9fbfa;
        display: block;
      }

      .attachment-empty {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 10px;
        border: 1px dashed var(--line);
        color: var(--muted);
        font-size: 0.68rem;
        background: #fbfdfc;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(17, 29, 25, 0.52);
        display: grid;
        place-items: center;
        z-index: 1000;
      }

      .modal-backdrop.hidden {
        display: none;
      }

      .modal-card {
        width: min(92vw, 420px);
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        padding: 20px;
        border: 1px solid var(--line);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 1.2rem;
      }

      .close-modal {
        border: none;
        background: #f3f7f5;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        font-size: 1.2rem;
        cursor: pointer;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .modal-actions .btn {
        width: auto;
        flex: 1;
      }

      .password-message {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.85rem;
        display: none;
      }

      .password-message.show {
        display: block;
      }

      .password-message.success {
        background: #eafaf0;
        color: var(--success);
        border: 1px solid #cfeedb;
      }

      .password-message.error {
        background: #fff0f0;
        color: var(--danger);
        border: 1px solid #efcaca;
      }

      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar {
          position: sticky;
          top: 0;
          height: auto;
          z-index: 10;
        }
        .main { padding: 18px 16px 28px; }
        .main-grid, .grid-2 { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        .form-grid { grid-template-columns: 1fr; }
        .right-tools { width: 100%; justify-content: space-between; }
        .user-pill { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="authScreen" class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-badge">K</div>
          <div>
            <strong>KasPanitia</strong>
            <small>Finance Portal</small>
          </div>
        </div>

        <h1 class="auth-title">Masuk</h1>
        <p class="auth-subtitle">Silakan masuk untuk mengakses dashboard keuangan</p>

        <form id="loginForm">
          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input id="email" type="email" placeholder="admin@kaspanitia.id" required />
          </div>

          <div class="form-group">
            <label class="label" for="password">Password</label>
            <input id="password" type="password" placeholder="Masukkan password" required />
          </div>

          <button type="submit" class="btn primary">Login</button>

          <div id="loginError" class="login-error"></div>
        </form>
      </div>
    </div>

    <div id="appScreen" class="hidden">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-badge">K</div>
            <div>
              <div class="brand-title">KasPanitia</div>
              <div class="brand-sub">Finance Portal</div>
            </div>
          </div>

          <div class="user-box">
            <div class="user-box-card">
              <div class="profile-photo-wrap">
                <img id="sidebarUserPhoto" class="user-mini-photo" alt="User photo" src="./assets/default-user.jpg" />
                <label class="photo-edit-btn" for="profileUploadInput">✎</label>
              </div>
              <div class="user-mini-meta">

    <div id="passwordModal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">

            <input id="newPassword" type="password" placeholder="Minimal 6 karakter" required />

            <input id="confirmPassword" type="password" placeholder="Ulangi password baru" required />

    <input id="profileUploadInput" type="file" accept="image/*" class="hidden-file-input" />

    <script>
      const STORAGE_KEY = "kaspanitia-live-v1";
      const AUTH_KEY = "kaspanitia-auth-v1";
      const PASSWORDS_KEY = "kaspanitia-passwords-v1";

      const defaultState = {
        currentUserId: "u-bendahara",
        users: [
          { id: "u-admin", name: "Admin Sistem", email: "admin@kaspanitia.id", role: "Admin", divisi: "-" },
          { id: "u-ketua", name: "Rina Ketua", email: "ketua@kaspanitia.id", role: "Ketua Panitia", divisi: "-" },
          { id: "u-bendahara", name: "Budi Bendahara", email: "bendahara@kaspanitia.id", role: "Bendahara", divisi: "-" },
          { id: "u-divisi-acara", name: "Ayu Acara", email: "acara@kaspanitia.id", role: "Koordinator Divisi", divisi: "Acara" },
          { id: "u-divisi-humas", name: "Dian Humas", email: "humas@kaspanitia.id", role: "Koordinator Divisi", divisi: "Humas" }
        ],
        accounts: [
          { id: "acc-cash", name: "Kas Tunai", type: "Kas Tunai", saldoAwal: 0 },
          { id: "acc-bank", name: "Rekening Bank", type: "Rekening Bank", saldoAwal: 0 }
        ],
        divisions: [],
        rab: [],
        submissions: [],
        transactions: [],
        auditLog: []
      };

      let activeScreen = "dashboard";
      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultState));
            return structuredClone(defaultState);
          }
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.users) throw new Error("invalid");
          return parsed;
        } catch {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultState));
          return structuredClone(defaultState);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function parseNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }).format(parseNumber(value));
      }

      function formatDate(dateString) {
        if (!dateString) return "-";
        const d = new Date(dateString + "T00:00:00");
        if (Number.isNaN(d.getTime())) return dateString;
        return d.toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        });
      }

      function getStoredPasswords() {
        try {
          return JSON.parse(localStorage.getItem(PASSWORDS_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function setStoredPassword(userId, password) {
        const map = getStoredPasswords();
        if (!password || !String(password).trim()) {
          delete map[userId];
        } else {
          map[userId] = String(password).trim();
        }
        localStorage.setItem(PASSWORDS_KEY, JSON.stringify(map));
      }

      function getUserPassword(user) {
        const map = getStoredPasswords();
        if (map[user.id]) return map[user.id];
        return getDefaultPassword(user);
      }

      function changePasswordForUser(userId, oldPassword, newPassword) {
        const user = getUserById(userId);
        if (!user) return { ok: false, message: "User tidak ditemukan." };

        const actualPassword = getUserPassword(user);
        if (String(oldPassword) !== String(actualPassword)) {
          return { ok: false, message: "Password lama salah." };
        }

        if (!newPassword || String(newPassword).trim().length < 6) {
          return { ok: false, message: "Password baru minimal 6 karakter." };
        }

        setStoredPassword(user.id, String(newPassword).trim());
        return { ok: true, message: "Password berhasil diubah." };
      }

      function getDefaultPassword(user) {
        const role = user.role;
        if (role === "Admin") return "admin123";
        if (role === "Ketua Panitia") return "ketua123";
        if (role === "Bendahara") return "bendahara123";
        if (role === "Koordinator Divisi") return "divisi123";
        return "123456";
      }

      function showAuth() {
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("appScreen").classList.add("hidden");
      }

      function showApp() {
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
      }

      function isLoggedIn() {
        const auth = JSON.parse(localStorage.getItem(AUTH_KEY) || "{}");
        return !!auth.userId && state.users.some(u => u.id === auth.userId);
      }

      function setLoggedUser(userId) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({ userId }));
        state.currentUserId = userId;
        saveState();
      }

      function logout() {
        localStorage.removeItem(AUTH_KEY);
        state.currentUserId = defaultState.currentUserId;
        saveState();
        showAuth();
      }

      function getCurrentUser() {
        return state.users.find(u => u.id === state.currentUserId) || state.users[0];
      }

      function getUserById(id) {
        return state.users.find(u => u.id === id);
      }

      function getAccountById(id) {
        return state.accounts.find(a => a.id === id);
      }

      function canAccess(key) {
        const role = getCurrentUser().role;
        const map = {
          dashboard: ["Admin", "Ketua Panitia", "Koordinator Divisi", "Bendahara"],
          rab: ["Bendahara", "Ketua Panitia"],
          pengajuan: ["Koordinator Divisi", "Bendahara", "Ketua Panitia"],
          transaksi: ["Bendahara"],
          laporan: ["Bendahara", "Ketua Panitia", "Admin"],
          audit: ["Admin", "Bendahara", "Ketua Panitia"],
          users: ["Admin"]
        };

        return (map[key] || []).includes(role);
      }

      function recordAudit(action, detail) {
        state.auditLog.unshift({
          id: "log-" + Date.now(),
          time: new Date().toLocaleString("sv-SE").replace(" ", " "),
          actor: getCurrentUser().name,
          action,
          detail
        });
        saveState();
      }

      function getAccountBalance(accountId) {
        const account = getAccountById(accountId);
        if (!account) return 0;

        let total = parseNumber(account.saldoAwal);

        state.transactions.forEach(tx => {
          if (tx.accountId === accountId && tx.type === "Pemasukan") total += parseNumber(tx.nominal);
          if (tx.accountId === accountId && tx.type === "Pengeluaran") total -= parseNumber(tx.nominal);
          if (tx.fromAccountId === accountId && tx.type === "Transfer") total -= parseNumber(tx.nominal);
          if (tx.toAccountId === accountId && tx.type === "Transfer") total += parseNumber(tx.nominal);
        });

        return total;
      }

      function totalPemasukan() {
        return state.transactions
          .filter(tx => tx.type === "Pemasukan")
          .reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
      }

      function totalPengeluaran() {
        return state.transactions
          .filter(tx => tx.type === "Pengeluaran")
          .reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
      }

      function totalAnggaran() {
        return state.rab.reduce((sum, item) => sum + parseNumber(item.amount), 0);
      }

      function totalMenungguPersetujuan() {
        return state.submissions.filter(s => ["Diajukan", "Perlu Revisi"].includes(s.status)).length;
      }

      function statusBadgeClass(status) {
        const normalized = String(status || "").trim().toLowerCase().replace(/\s+/g, "-");
        return "badge status-" + normalized;
      }

      function setCurrentUser(userId) {
        if (!state.users.some(u => u.id === userId)) return;
        state.currentUserId = userId;
        saveState();
        render();
      }

      function getUserPhoto(userId) {
        const map = {
          "u-admin": "./assets/default-admin.jpg",
          "u-ketua": "./assets/default-ketua.jpg",
          "u-bendahara": "./assets/bendahara.jpg",
          "u-divisi-acara": "./assets/acara.jpg",
          "u-divisi-humas": "./assets/humas.jpg"
        };
        return map[userId] || "./assets/default-user.jpg";
      }

      function getUserPhotoKey(userId) {
        return `kaspanitia-photo-${userId}`;
      }

      function getStoredUserPhoto(userId) {
        return localStorage.getItem(getUserPhotoKey(userId));
      }

      function setStoredUserPhoto(userId, base64) {
        if (!base64) {
          localStorage.removeItem(getUserPhotoKey(userId));
          return;
        }
        localStorage.setItem(getUserPhotoKey(userId), base64);
      }

      function handleProfileUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function () {
          const base64 = reader.result;
          const curr = getCurrentUser();
          setStoredUserPhoto(curr.id, base64);

          const photo = base64 || getUserPhoto(curr.id);
          document.getElementById("userAvatar").src = photo;
          document.getElementById("sidebarUserPhoto").src = photo;
        };
        reader.readAsDataURL(file);
      }

      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Gagal membaca file"));
          reader.readAsDataURL(file);
        });
      }

      function resetState() {
        const confirmed = window.confirm("Yakin ingin reset semua data aplikasi?");
        if (!confirmed) return;

        state = structuredClone(defaultState);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        localStorage.removeItem(PASSWORDS_KEY);
        activeScreen = "dashboard";
        render();
      }

      function getUniqueDivisions() {
        const values = [
          ...state.rab.map(item => item.division),
          ...state.transactions.map(item => item.division),
          ...state.submissions.map(item => item.division)
        ].filter(Boolean);

        return [...new Set(values)];
      }

      function exportCsv() {
        const now = new Date();
        const income = totalPemasukan();
        const expense = totalPengeluaran();
        const net = income - expense;
        const cash = getAccountBalance("acc-cash");
        const bank = getAccountBalance("acc-bank");
        const rabTotal = totalAnggaran();

        const rows = [
          ["KasPanitia Premium", "", "", "", "", "", "", ""],
          ["Tanggal Export", now.toLocaleDateString("id-ID"), "", "", "", "", "", ""],
          ["Pengguna", `${getCurrentUser().name} (${getCurrentUser().role})`, "", "", "", "", "", ""],
          ["", "", "", "", "", "", "", ""],
          ["Pemasukan", formatCurrency(income), "Pengeluaran", formatCurrency(expense), "Saldo Net", formatCurrency(net), "Total RAB", formatCurrency(rabTotal)],
          ["Kas Tunai", formatCurrency(cash), "Rekening Bank", formatCurrency(bank), "", "", "", ""],
          ["", "", "", "", "", "", "", ""],
          ["Tanggal", "Jenis", "Deskripsi", "Kategori", "Akun", "Divisi", "Nominal", "Status"]
        ];

        const transactionRows = state.transactions.map(tx => [
          tx.date || "",
          tx.type || "",
          tx.description || "",
          tx.category || "",
          getAccountById(tx.accountId)?.name || "",
          tx.division || "",
          String(parseNumber(tx.nominal)),
          tx.status || ""
        ]);

        const csvContent = [...rows, ...transactionRows]
          .map(row =>
            row.map(value => {
              const str = String(value ?? "")
                .replace(/\r?\n/g, " ")
                .replace(/"/g, '""');
              return `"${str}"`;
            }).join(",")
          )
          .join("\n");

        const blob = new Blob(["\uFEFF" + csvContent], {
          type: "text/csv;charset=utf-8;"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "kaspanitia-laporan-keuangan.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function exportPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Library PDF gagal dimuat.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("p", "pt", "a4");
        const pageWidth = doc.internal.pageSize.getWidth();

        const currentUser = getCurrentUser();
        const income = totalPemasukan();
        const expense = totalPengeluaran();
        const cash = getAccountBalance("acc-cash");
        const bank = getAccountBalance("acc-bank");
        const rabTotal = totalAnggaran();
        const net = income - expense;

        doc.setFillColor(30, 91, 77);
        doc.rect(0, 0, pageWidth, 90, "F");

        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.text("KasPanitia Premium", 40, 42);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text("Laporan Keuangan", 40, 60);

        doc.setFontSize(9);
        doc.text(
          `${new Date().toLocaleDateString("id-ID")} • ${currentUser.name} • ${currentUser.role}`,
          pageWidth - 40,
          60,
          { align: "right" }
        );

        const cards = [
          { title: "Pemasukan", value: formatCurrency(income), x: 40, y: 110, color: [232, 250, 239], icon: "↑" },
          { title: "Pengeluaran", value: formatCurrency(expense), x: 300, y: 110, color: [254, 236, 236], icon: "↓" },
          { title: "Kas Tunai", value: formatCurrency(cash), x: 40, y: 180, color: [236, 244, 255], icon: "₵" },
          { title: "Bank", value: formatCurrency(bank), x: 300, y: 180, color: [255, 245, 220], icon: "B" }
        ];

        cards.forEach(card => {
          const w = 220;
          const h = 52;

          doc.setFillColor(...card.color);
          doc.roundedRect(card.x, card.y, w, h, 12, 12, "F");

          doc.setFillColor(30, 91, 77);
          doc.roundedRect(card.x + w - 26, card.y + 12, 18, 18, 6, 6, "F");

          doc.setTextColor(255,255,255);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(10);
          doc.text(card.icon, card.x + w - 18, card.y + 25, { align: "center" });

          doc.setTextColor(101,117,109);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.text(card.title, card.x + 16, card.y + 20);

          doc.setTextColor(22,35,33);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(16);
          doc.text(card.value, card.x + 16, card.y + 38);
        });

        const stripY = 250;
        doc.setFillColor(233, 245, 242);
        doc.roundedRect(40, stripY, pageWidth - 80, 42, 12, 12, "F");

        doc.setTextColor(24,49,45);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text("Saldo Net", 56, stripY + 18);

        doc.setFontSize(18);
        doc.text(formatCurrency(net), 56, stripY + 34);

        doc.setTextColor(30, 91, 77);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Total RAB: ${formatCurrency(rabTotal)}`, pageWidth - 200, stripY + 20);
        doc.text(`Transaksi: ${state.transactions.length}`, pageWidth - 200, stripY + 34);

        const rows = state.transactions.slice(0, 18).map(tx => [
          formatDate(tx.date),
          tx.type || "-",
          tx.division || "-",
          (tx.description || "-").length > 30 ? (tx.description || "-").slice(0, 30) + "..." : (tx.description || "-"),
          formatCurrency(tx.nominal || 0),
          tx.status || "-"
        ]);

        doc.setTextColor(24,49,45);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("Daftar Transaksi", 40, 330);

        doc.autoTable({
          startY: 345,
          head: [["Tanggal", "Jenis", "Divisi", "Deskripsi", "Nominal", "Status"]],
          body: rows,
          theme: "grid",
          styles: {
            fontSize: 8,
            cellPadding: 7,
            overflow: "linebreak",
            valign: "middle",
            lineColor: [223,234,230],
            lineWidth: 0.5
          },
          headStyles: {
            fillColor: [30, 91, 77],
            textColor: [255, 255, 255],
            fontStyle: "bold",
            fontSize: 8
          },
          bodyStyles: {
            fillColor: [255,255,255],
            textColor: [24,49,45]
          },
          alternateRowStyles: {
            fillColor: [247,250,249]
          },
          columnStyles: {
            0: { cellWidth: 52, halign: "center" },
            1: { cellWidth: 52, halign: "center" },
            2: { cellWidth: 62, halign: "center" },
            3: { cellWidth: 160 },
            4: { cellWidth: 82, halign: "right" },
            5: { cellWidth: 60, halign: "center" }
          },
          margin: { left: 40, right: 40 },
          didParseCell: function (data) {
            if (data.section === "body" && data.column.index === 4) {
              const value = String(data.cell.raw || "");
              if (value.includes("-")) {
                data.cell.styles.textColor = [216, 85, 85];
              } else {
                data.cell.styles.textColor = [29, 142, 93];
              }
            }

            if (data.section === "body" && data.column.index === 5) {
              const status = String(data.cell.raw || "").toLowerCase();
              if (status.includes("ditolak") || status.includes("perlu revisi")) {
                data.cell.styles.textColor = [216, 85, 85];
              } else if (status.includes("disetujui")) {
                data.cell.styles.textColor = [29, 142, 93];
              } else if (status.includes("diajukan")) {
                data.cell.styles.textColor = [201, 134, 27];
              } else {
                data.cell.styles.textColor = [61, 122, 217];
              }
            }
          }
        });

        const divisionSummary = getUniqueDivisions().map(div => {
          const rabTotal = state.rab
            .filter(r => r.division === div)
            .reduce((sum, r) => sum + parseNumber(r.amount), 0);

          const realized = state.transactions
            .filter(tx => tx.division === div && tx.type === "Pengeluaran")
            .reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);

          return [div, formatCurrency(rabTotal), formatCurrency(realized), formatCurrency(rabTotal - realized)];
        });

        if (divisionSummary.length) {
          doc.setTextColor(24,49,45);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(12);

          const finalY = doc.lastAutoTable.finalY + 24;
          doc.text("Ringkasan Per Divisi", 40, finalY);

          doc.autoTable({
            startY: finalY + 16,
            head: [["Divisi", "RAB", "Realisasi", "Sisa"]],
            body: divisionSummary,
            theme: "grid",
            styles: {
              fontSize: 8,
              cellPadding: 7,
              overflow: "linebreak",
              valign: "middle",
              lineColor: [223,234,230],
              lineWidth: 0.5
            },
            headStyles: {
              fillColor: [30, 91, 77],
              textColor: [255,255,255],
              fontStyle: "bold"
            },
            alternateRowStyles: {
              fillColor: [247,250,249]
            },
            margin: { left: 40, right: 40 }
          });
        }

        doc.save("laporan-keuangan-kaspanitia.pdf");
      }

      function updateQuickActionButton() {
        const btn = document.getElementById("quickAction");
        if (!btn) return;

        const isBendahara = getCurrentUser().role === "Bendahara";
        btn.style.display = isBendahara ? "" : "none";
        btn.disabled = !isBendahara;
      }

      function updateHeaderMeta() {
        const curr = getCurrentUser();

        document.getElementById("userRoleTop").textContent = curr.role;
        document.getElementById("userNameTop").textContent = curr.name;
        document.getElementById("sidebarUserName").textContent = curr.name;
        document.getElementById("sidebarUserRole").textContent = curr.role;

        const stored = getStoredUserPhoto(curr.id);
        const photo = stored || getUserPhoto(curr.id);

        document.getElementById("userAvatar").src = photo;
        document.getElementById("sidebarUserPhoto").src = photo;

            recordAudit("Hapus transaksi", `${tx.description} • ${formatCurrency(tx.nominal || 0)}`);
            render();
          });
        });

            </div>

            <div style="margin-top:20px;">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Divisi</th>
                      <th>RAB</th>
                      <th>Realisasi</th>
                      <th>Sisa</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${divisionNames.length ? divisionNames.map(div => {
                      const rabTotal = state.rab.filter(r => r.division === div).reduce((sum, r) => sum + parseNumber(r.amount), 0);
                      const realized = state.transactions.filter(tx => tx.division === div && tx.type === "Pengeluaran").reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
                      return `
                        <tr>
                          <td>${div}</td>
                          <td>${formatCurrency(rabTotal)}</td>
                          <td>${formatCurrency(realized)}</td>
                          <td>${formatCurrency(rabTotal - realized)}</td>
                        </tr>
                      `;
                    }).join("") : `<tr><td colspan="4"><div class="empty">Belum ada divisi. Isi divisi dari form RAB / Pengajuan / Transaksi terlebih dahulu.</div></td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      function renderAudit() {
        if (!canAccess("audit")) return;

        document.getElementById("screen-audit").innerHTML = `
          <div class="section">
            <div class="section-header">
              <h3>Audit Log</h3>
              <span class="muted">Jejak aktivitas</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Waktu</th>
                    <th>Pengguna</th>
                    <th>Aksi</th>
                    <th>Detail</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.auditLog.length ? state.auditLog.map(log => `
                    <tr>
                      <td>${log.time || "-"}</td>
                      <td>${log.actor || "-"}</td>
                      <td>${log.action || "-"}</td>
                      <td>${log.detail || "-"}</td>
                    </tr>
                  `).join("") : `<tr><td colspan="4"><div class="empty">Belum ada log audit.</div></td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderUsers() {
        if (!canAccess("users")) return;

        document.getElementById("screen-users").innerHTML = `
          <div class="section">
            <div class="section-header">
              <h3>Kelola Pengguna</h3>
              <span class="muted">Admin only</span>
            </div>

            <form id="userForm">
              <div class="form-grid">
                <div class="field">
                  <label class="label">Nama</label>
                  <input type="text" name="name" required />
                </div>

                <div class="field">
                  <label class="label">Email</label>
                  <input type="email" name="email" required />
                </div>

                <div class="field">
                  <label class="label">Role</label>
                  <select name="role" required>
                    <option value="Admin">Admin</option>
                    <option value="Ketua Panitia">Ketua Panitia</option>
                    <option value="Koordinator Divisi">Koordinator Divisi</option>
                    <option value="Bendahara">Bendahara</option>
                  </select>
                </div>

                <div class="field">
                  <label class="label">Divisi</label>
                  <input type="text" name="divisi" placeholder="Opsional" />
                </div>
              </div>

              <div style="margin-top:12px;">
                <button class="btn primary" type="submit">Tambah User</button>
              </div>
            </form>

            <div style="margin-top:20px;">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nama</th>
                      <th>Email</th>
                      <th>Role</th>
                      <th>Divisi</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.users.map(user => `
                      <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                        <td>${user.divisi || "-"}</td>
                        <td><button class="btn danger btn-delete-user" data-id="${user.id}" ${user.id === state.currentUserId ? "disabled" : ""}>Hapus</button></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        document.getElementById("userForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const name = String(fd.get("name") || "").trim();
          const email = String(fd.get("email") || "").trim();
          const role = String(fd.get("role") || "").trim();
          const divisi = String(fd.get("divisi") || "").trim();

          if (!name || !email || !role) {
            alert("Nama, email, dan role wajib diisi.");
            return;
          }

          state.users.push({
            id: "u-" + Date.now(),
            name,
            email,
            role,
            divisi: divisi || "-"
          });

          saveState();
          recordAudit("Tambah user", `${name} (${role})`);
          render();
        });

        document.querySelectorAll(".btn-delete-user").forEach(button => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            if (id === state.currentUserId) {
              alert("Tidak bisa menghapus user yang sedang aktif.");
              return;
            }

            state.users = state.users.filter(u => u.id !== id);
            saveState();
            recordAudit("Hapus user", `User dihapus dari sistem`);
            render();
          });
        });
      }

      function attachStaticEvents() {
        const searchInput = document.getElementById("globalSearch");
        if (searchInput) {
          searchInput.oninput = (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            const rows = document.querySelectorAll("tbody tr");
            rows.forEach(row => {
              const text = row.textContent.toLowerCase();
              row.style.display = (!keyword || text.includes(keyword)) ? "" : "none";
            });
          };
        }

        const quickAction = document.getElementById("quickAction");
        if (quickAction) {
          quickAction.onclick = () => {
            if (getCurrentUser().role !== "Bendahara") return;
            activeScreen = "transaksi";
            render();
          };
        }

        const exportBtn = document.getElementById("exportCsvBtn");
        if (exportBtn) exportBtn.onclick = exportCsv;

        const pdfBtn = document.getElementById("downloadPdfBtn");
        if (pdfBtn) pdfBtn.onclick = exportPdf;

        const resetBtn = document.getElementById("resetDataBtn");
        if (resetBtn) resetBtn.onclick = resetState;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) logoutBtn.onclick = logout;

        const changePasswordBtn = document.getElementById("changePasswordBtn");
        if (changePasswordBtn) {
          changePasswordBtn.onclick = () => {
            const modal = document.getElementById("passwordModal");
            const form = document.getElementById("changePasswordForm");
            const message = document.getElementById("passwordMessage");

            message.className = "password-message";
            message.textContent = "";
            form.reset();

            modal.classList.remove("hidden");
          };
        }

        const closePasswordModal = document.getElementById("closePasswordModal");
        if (closePasswordModal) {
          closePasswordModal.onclick = () => {
            document.getElementById("passwordModal").classList.add("hidden");
          };
        }

        const cancelPasswordBtn = document.getElementById("cancelPasswordBtn");
        if (cancelPasswordBtn) {
          cancelPasswordBtn.onclick = () => {
            document.getElementById("passwordModal").classList.add("hidden");
          };
        }

        const passwordModal = document.getElementById("passwordModal");
        if (passwordModal) {
          passwordModal.addEventListener("click", (e) => {
            if (e.target === passwordModal) {
              passwordModal.classList.add("hidden");
            }
          });
        }

        const changePasswordForm = document.getElementById("changePasswordForm");
        if (changePasswordForm) {
          changePasswordForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const messageEl = document.getElementById("passwordMessage");

            if (String(newPassword) !== String(confirmPassword)) {
              messageEl.textContent = "Konfirmasi password baru tidak cocok.";
              messageEl.className = "password-message show error";
              return;
            }

            const result = changePasswordForUser(state.currentUserId, currentPassword, newPassword);

            if (!result.ok) {
              messageEl.textContent = result.message;
              messageEl.className = "password-message show error";
              return;
            }

            messageEl.textContent = result.message;
            messageEl.className = "password-message show success";

            setTimeout(() => {
              document.getElementById("passwordModal").classList.add("hidden");
              changePasswordForm.reset();
              messageEl.className = "password-message";
              messageEl.textContent = "";
            }, 1200);
          });
        }

        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
          loginForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();
            const user = state.users.find(u => u.email.toLowerCase() === email);
            const errorBox = document.getElementById("loginError");

            if (!user) {
              errorBox.textContent = "Email tidak ditemukan.";
              errorBox.classList.add("show");
              return;
            }

            if (password !== getUserPassword(user)) {
              errorBox.textContent = "Password salah.";
              errorBox.classList.add("show");
              return;
            }

            errorBox.classList.remove("show");
            setLoggedUser(user.id);
            showApp();
            render();
          });
        }

        const profileUploadInput = document.getElementById("profileUploadInput");
        if (profileUploadInput) {
          profileUploadInput.addEventListener("change", handleProfileUpload);
        }
      }

      function render() {
        if (isLoggedIn()) {
          state.currentUserId = JSON.parse(localStorage.getItem(AUTH_KEY) || "{}").userId || state.currentUserId;
          showApp();
        } else {
          showAuth();
        }

        if (isLoggedIn()) {
          updateQuickActionButton();
          renderScreenVisibility();
          renderNav();
          updateHeaderMeta();

          if (canAccess("dashboard")) renderDashboard();
          if (canAccess("rab")) renderRab();
          if (canAccess("pengajuan")) renderPengajuan();
          if (canAccess("transaksi")) renderTransaksi();
          if (canAccess("laporan")) renderLaporan();
          if (canAccess("audit")) renderAudit();
          if (canAccess("users")) renderUsers();
        }
      }

      document.querySelectorAll("#userAvatar, #sidebarUserPhoto").forEach(img => {
        img.addEventListener("error", function () {
          this.src = "./assets/default-user.jpg";
        });
      });

      attachStaticEvents();
      render();
    </script>
  </body>
</html>
